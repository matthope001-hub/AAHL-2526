# AAHL member-saves API - Cloudflare Worker.
# Deployed automatically by Cloudflare whenever this folder changes on GitHub
# (Workers & Pages -> aahl-api -> Settings -> Build: root directory "worker").
name = "aahl-2526"
main = "src/index.js"
compatibility_date = "2024-09-23"
keep_vars = true

# Answers at https://api.theaahl.ca (theaahl.ca's DNS is already on Cloudflare).
routes = [
  { pattern = "api.theaahl.ca", custom_domain = true }
]

# Live points: every minute from 11am to 4am ET (games only - other runs
# stop after one small read). To switch off without a deploy, add a
# variable LIVE_POINTS = off in the dashboard (Apps Script takes over).
[triggers]
crons = ["* 15-23,0-8 * * *"]

# Public, non-secret settings. The three secrets (SUPABASE_SERVICE_KEY,
# WORKER_SHARED_SECRET, LATE_INVITE_SECRET) are added in the Cloudflare
# dashboard, never here - this file is public on GitHub.
[vars]
SUPABASE_URL = "https://tetgrmgurobacdohhiby.supabase.co"
APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzJA2dDY7N2IY9xrwMpr-XYybw2Z8ZWybXTH8Sm7eYn1tR1qBaEAzc8N9Vp2jmM_bYVdA/exec"
