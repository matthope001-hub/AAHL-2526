<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAHL — Card Preview</title>
<link rel="icon" href="alpaca-pixel.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--panel:#141414;--panel2:#1c1c1c;--border:#2a2a2a;--ice:#4C8FC4;--amber:#A13F5C;--gold:#FFB800;--text:#e8edf1;--dim:#A2AAAD;--up:#3ecf6a;--down:#ff5c5c;--disp:'Barlow Condensed',sans-serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--disp);min-height:100vh}
.mono{font-family:var(--mono)}
header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:5}
header img{height:36px}
header h1{font-size:24px;letter-spacing:1px;flex:1}
header .tag{font-family:var(--mono);font-size:11px;color:var(--gold);border:1px solid var(--gold);padding:2px 6px;border-radius:4px}
nav{display:flex;gap:4px;padding:10px 16px;border-bottom:1px solid var(--border)}
nav button{background:none;border:1px solid var(--border);color:var(--dim);font-family:var(--disp);font-size:16px;padding:6px 14px;border-radius:6px;cursor:pointer;letter-spacing:.5px}
nav button.on{color:var(--text);border-color:var(--ice);background:#0f1a24}
main{max-width:960px;margin:0 auto;padding:16px}
.msg{font-family:var(--mono);color:var(--dim);font-size:13px;padding:20px 0;text-align:center}
.srow{display:grid;grid-template-columns:40px 1fr 80px 64px 28px;align-items:center;padding:12px 8px;border-top:1px solid var(--border);cursor:pointer}
.srow:hover,.srow.open{background:var(--panel)}
.srow .rk{font-family:var(--mono);color:var(--dim)}
.srow .rk.top{color:var(--gold)}
.srow .nm{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .pt{font-family:var(--mono);font-size:18px;text-align:right}
.srow .dl{font-family:var(--mono);font-size:13px;text-align:right}
.srow .chev{color:var(--dim);text-align:right;transition:transform .2s}
.srow.open .chev{transform:rotate(90deg)}
.drawer{background:var(--panel);padding:4px 8px 16px}
.grp{font-size:15px;color:var(--dim);letter-spacing:1px;margin:12px 0 8px}
.grp span{font-family:var(--mono);color:var(--ice);font-size:13px;margin-left:6px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.mc{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:8px;position:relative;overflow:hidden;height:132px;cursor:pointer;transition:border-color .15s,transform .15s}
.mc:hover{border-color:var(--ice);transform:translateY(-2px)}
.mc .wm{position:absolute;right:-14px;top:-10px;width:78px;height:78px;opacity:.16}
.mc .hs{width:52px;height:52px;border-radius:50%;background:var(--panel2);object-fit:cover;position:relative}
.mc .n{font-size:16px;line-height:1.05;margin-top:4px;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc .m{font-family:var(--mono);font-size:10px;color:var(--dim)}
.mc .p{position:absolute;bottom:8px;right:8px;font-family:var(--mono);font-size:16px;color:var(--ice)}
.mc .bx{position:absolute;bottom:10px;left:8px;font-family:var(--mono);font-size:10px;color:var(--gold)}
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tools input,.tools select{background:var(--panel);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:13px;padding:8px 10px;border-radius:6px}
.tools input{flex:1;min-width:160px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.ov.on{display:flex}
.fc{width:100%;max-width:440px;background:#0b0d10;border:1px solid #1e2a33;border-radius:16px;overflow:hidden;position:relative;animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.fc .wm{position:absolute;right:-40px;top:-30px;width:240px;height:240px;opacity:.14}
.fc .x{position:absolute;top:10px;right:12px;background:none;border:0;color:var(--dim);font-size:26px;cursor:pointer;z-index:2}
.fc .top{display:flex;position:relative;min-height:190px}
.fc .info{flex:1;padding:20px 0 14px 20px}
.fc .nm{font-size:30px;line-height:.95;letter-spacing:.5px;text-transform:uppercase}
.fc .meta{font-family:var(--mono);font-size:13px;color:var(--dim);margin:10px 0 6px;display:flex;align-items:center;gap:6px}
.fc .meta img{width:20px;height:20px}
.fc .sub{font-family:var(--mono);font-size:12px;color:var(--gold);margin-bottom:4px}
.fc .ir{display:inline-block;background:var(--down);color:#fff;font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:4px;margin-top:4px}
.fc .hs{width:160px;align-self:flex-end;position:relative}
.fc .hs img{width:160px;display:block}
.fc .strip{margin:0 12px 12px;border:1px solid #1e2a33;border-radius:12px;display:grid;grid-template-columns:repeat(4,1fr);padding:12px 0;background:#10161c;position:relative}
.fc .strip div{text-align:center}
.fc .strip b{display:block;font-family:var(--mono);font-size:22px;font-weight:500}
.fc .strip b.ice{color:var(--ice)}
.fc .strip small{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.5px}
@media(max-width:520px){.srow{grid-template-columns:30px 1fr 70px 52px 20px}.fc .hs,.fc .hs img{width:120px}.fc .nm{font-size:26px}}
</style>
</head>
<body>
<header><img src="aahl-logo.png" alt=""><h1>AAHL</h1><span class="tag">CARD PREVIEW</span></header>
<nav><button data-v="standings" class="on">Standings</button><button data-v="players">Players</button><button onclick="location.href='index.html'">Back to site</button></nav>
<main id="view"><p class="msg">Loading…</p></main>
<div class="ov" id="ov"><div id="fcwrap"></div></div>

<script src="data.js"></script>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const logo = t => t ? `https://assets.nhle.com/logos/nhl/svg/${t}_light.svg` : '';
const f2 = n => (Number(n) || 0).toFixed(2);
let players = [], standings = [], openId = null, picksCache = {};

const pById = id => players.find(p => String(p.id) === String(id)) || {};
const isG = p => p.isGoalie || p.position === 'G';
const gp = s => (s && (s.gamesPlayed ?? s.games)) || 0;

function splitName(n) {
  const parts = String(n || '').trim().split(' ');
  return parts.length > 1 ? [parts.shift(), parts.join(' ')] : ['', parts[0] || ''];
}

// ---------- Full card ----------
function openCard(playerId, extra) {
  const p = pById(playerId);
  const x = extra || {};
  const name = p.fullName || x.playerName || '';
  const team = p.team || x.team || '';
  const s = p.stats || {};
  const g = isG(p) || x.boxType === 'G';
  const [first, last] = splitName(name);
  const hs = p.headshotUrl || x.headshotUrl || '';
  const num = p.sweaterNumber || p.number || '';
  const stats = g
    ? [[gp(s), 'GP'], [s.wins || 0, 'W'], [s.shutouts || 0, 'SO'], [s.saves || 0, 'SV']]
    : [[gp(s), 'GP'], [s.goals || 0, 'G'], [s.assists || 0, 'A'], [(s.goals || 0) + (s.assists || 0), 'PTS']];
  const poolPts = x.contributionSinceAcquired != null ? f2(x.contributionSinceAcquired) : null;
  document.getElementById('fcwrap').innerHTML = `
    <div class="fc">
      ${team ? `<img class="wm" src="${logo(team)}" alt="" onerror="this.remove()">` : ''}
      <button class="x" onclick="closeCard()" aria-label="Close">×</button>
      <div class="top">
        <div class="info">
          <div class="nm">${esc(first)}<br>${esc(last)}</div>
          <div class="meta">${team ? `<img src="${logo(team)}" alt="" onerror="this.remove()">` : ''}${esc(team)} · ${g ? 'G' : esc(p.position || x.boxType || '')}${num ? ' · #' + esc(num) : ''}</div>
          ${x.boxId ? `<div class="sub">BOX ${esc(x.boxId)}</div>` : ''}
          ${poolPts != null ? `<div class="sub" style="color:var(--ice)">${poolPts} POOL PTS</div>` : ''}
          ${p.injury || p.ir ? `<span class="ir">IR</span>` : ''}
        </div>
        <div class="hs">${hs ? `<img src="${esc(hs)}" alt="" onerror="this.remove()">` : ''}</div>
      </div>
      <div class="strip">${stats.map((t, i) => `<div><b class="${i === 3 ? 'ice' : ''}">${t[0]}</b><small>${t[1]}</small></div>`).join('')}</div>
    </div>`;
  document.getElementById('ov').classList.add('on');
}
function closeCard() { document.getElementById('ov').classList.remove('on'); }
document.getElementById('ov').addEventListener('click', e => { if (e.target.id === 'ov') closeCard(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });

function miniCard(pk) {
  const p = pById(pk.playerId);
  const team = pk.team || p.team || '';
  const hs = pk.headshotUrl || p.headshotUrl || '';
  const key = 'k' + Math.random().toString(36).slice(2);
  window[key] = pk;
  return `<div class="mc" onclick="openCard('${esc(pk.playerId)}', window['${key}'])">
    ${team ? `<img class="wm" src="${logo(team)}" alt="" onerror="this.remove()">` : ''}
    ${hs ? `<img class="hs" src="${esc(hs)}" alt="" loading="lazy">` : `<div class="hs"></div>`}
    <div class="n">${esc(splitName(pk.playerName || p.fullName)[1])}</div>
    <div class="m">${esc(team)} · ${esc(pk.boxType || p.position || '')}</div>
    ${pk.boxId ? `<div class="bx">#${esc(pk.boxId)}</div>` : ''}
    <div class="p">${f2(pk.contributionSinceAcquired)}</div>
  </div>`;
}

// ---------- Standings ----------
function deltaHtml(e) {
  if (e.ptsDelta == null) return '<span style="color:var(--dim)">—</span>';
  return `<span style="color:${e.ptsDelta > 0 ? 'var(--up)' : 'var(--dim)'}">${e.ptsDelta > 0 ? '+' : ''}${f2(e.ptsDelta)}</span>`;
}

async function renderStandings() {
  const v = document.getElementById('view');
  if (!standings.length) { v.innerHTML = '<p class="msg">No standings yet.</p>'; return; }
  const rows = [...standings].filter(e => e.entryId).sort((a, b) => (a.rank ?? 999) - (b.rank ?? 999));
  v.innerHTML = rows.map(e => `
    <div class="srow ${openId === e.entryId ? 'open' : ''}" onclick="toggleEntry('${esc(e.entryId)}')">
      <span class="rk ${e.rank <= 3 ? 'top' : ''}">${e.rank ?? '—'}</span>
      <span class="nm">${esc(e.teamName)}</span>
      <span class="pt">${f2(e.pts)}</span>
      <span class="dl">${deltaHtml(e)}</span>
      <span class="chev">›</span>
    </div>
    ${openId === e.entryId ? `<div class="drawer" id="drawer">${picksCache[e.entryId] ? drawerHtml(picksCache[e.entryId]) : '<p class="msg">Loading picks…</p>'}</div>` : ''}
  `).join('');
}

function drawerHtml(data) {
  if (!data || data.error) return `<p class="msg">${esc((data && data.error) || "Couldn't load picks.")}</p>`;
  const groups = { F: 'Forwards', D: 'Defence', G: 'Goalies' };
  return Object.keys(groups).map(t => {
    const list = (data.picks || []).filter(p => (p.boxType || 'F') === t)
      .sort((a, b) => (b.contributionSinceAcquired || 0) - (a.contributionSinceAcquired || 0));
    if (!list.length) return '';
    const tot = list.reduce((s, p) => s + (p.contributionSinceAcquired || 0), 0);
    return `<div class="grp">${groups[t].toUpperCase()}<span>${f2(tot)}</span></div><div class="mgrid">${list.map(miniCard).join('')}</div>`;
  }).join('');
}

async function toggleEntry(id) {
  openId = openId === id ? null : id;
  renderStandings();
  if (openId && !picksCache[id]) {
    picksCache[id] = await fetchEntryPicks(id);
    if (openId === id) renderStandings();
  }
}

// ---------- Players ----------
let pq = '', ppos = 'all';
function renderPlayers() {
  const v = document.getElementById('view');
  v.innerHTML = `
    <div class="tools">
      <input id="pq" placeholder="Search name or team" value="${esc(pq)}">
      <select id="ppos">${['all', 'F', 'D', 'G'].map(o => `<option value="${o}" ${ppos === o ? 'selected' : ''}>${o === 'all' ? 'All positions' : o}</option>`).join('')}</select>
    </div>
    <div class="mgrid" id="pgrid"></div>`;
  document.getElementById('pq').addEventListener('input', e => { pq = e.target.value; drawPlayers(); });
  document.getElementById('ppos').addEventListener('change', e => { ppos = e.target.value; drawPlayers(); });
  drawPlayers();
}
function drawPlayers() {
  const q = pq.toLowerCase();
  const posOk = p => ppos === 'all' || (ppos === 'G' ? isG(p) : ppos === 'D' ? p.position === 'D' : (!isG(p) && p.position !== 'D'));
  const list = players.filter(p => posOk(p) && ((p.fullName || '').toLowerCase().includes(q) || (p.team || '').toLowerCase().includes(q)))
    .sort((a, b) => {
      const sa = a.stats || {}, sb = b.stats || {};
      const va = isG(a) ? (sa.wins || 0) * 2 : (sa.goals || 0) + (sa.assists || 0);
      const vb = isG(b) ? (sb.wins || 0) * 2 : (sb.goals || 0) + (sb.assists || 0);
      return vb - va;
    }).slice(0, 60);
  document.getElementById('pgrid').innerHTML = list.length ? list.map(p => {
    const s = p.stats || {};
    return miniCard({ playerId: p.id, playerName: p.fullName, team: p.team, headshotUrl: p.headshotUrl, boxType: isG(p) ? 'G' : p.position, contributionSinceAcquired: isG(p) ? (s.wins || 0) : (s.goals || 0) + (s.assists || 0) });
  }).join('') : '<p class="msg" style="grid-column:1/-1">No players match.</p>';
}

// ---------- Nav ----------
let view = 'standings';
document.querySelectorAll('nav button[data-v]').forEach(b => b.addEventListener('click', () => {
  view = b.dataset.v;
  document.querySelectorAll('nav button[data-v]').forEach(x => x.classList.toggle('on', x === b));
  view === 'standings' ? renderStandings() : renderPlayers();
}));

(async () => {
  try {
    [players, standings] = await Promise.all([fetchPlayers(), fetchStandings()]);
    renderStandings();
  } catch (e) {
    document.getElementById('view').innerHTML = `<p class="msg">Couldn't load data.</p>`;
  }
})();
</script>
</body>
</html>
